name: GeesNO Core CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test-run:
    name: Build, test, and smoke run
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify .NET SDK
        shell: pwsh
        run: |
          $sdkVersion = (& dotnet --version).Trim()
          Write-Host "dotnet --version: $sdkVersion"

          if ($sdkVersion -notmatch '^8\.') {
            throw "Expected .NET 8 SDK but found '$sdkVersion'."
          }

      - name: Restore
        run: dotnet restore GeesNO.Core.sln

      - name: Build
        run: dotnet build GeesNO.Core.sln --no-restore

      - name: Test
        run: dotnet test GeesNO.Core.sln --no-build

      - name: Smoke run Host
        run: dotnet run --project src\GeesNO.Core.Host

      - name: Smoke run sample CLI
        run: dotnet run --project samples/GeesNO.Sample.Cli --no-build -- echo ci-smoke

      - name: Format check
        run: dotnet format GeesNO.Core.sln --verify-no-changes --no-restore

      - name: Solution list
        run: dotnet sln GeesNO.Core.sln list

      - name: Diff whitespace check
        run: git diff --check

      - name: Ensure no tracked bin or obj files
        shell: pwsh
        run: |
          $tracked = git ls-files
          $matches = $tracked | Where-Object { $_ -match '(^|/)(bin|obj)/' }
          if ($matches) {
            $matches | ForEach-Object { Write-Error $_ }
            exit 1
          }
